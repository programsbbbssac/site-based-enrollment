<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Blocks every outside script, font, tracker and form. Keeps the page private by design. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a714e">
  <title>Site-Based Mentoring | Big Brothers Big Sisters of the Greater Sacramento Area</title>
  <meta name="description" content="Find the Big Brothers Big Sisters site-based mentoring program that fits you, then follow your step-by-step checklist.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a714e'/%3E%3Cpath d='M9 16.5l4.5 4.5 9.5-10' fill='none' stroke='%2300fb87' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- After changing styles.css, steps.js or app.js, raise these ?v= numbers so visitors get the new files. -->
  <link rel="stylesheet" href="styles.css?v=5">
  <!-- steps.js holds all the words. app.js builds the pages from it. -->
  <script src="steps.js?v=5" defer></script>
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-ui="skipLink">Skip to main content</a>

  <header class="site-header">
    <div class="logo-bar">
      <div class="logo-tab">
        <img class="logo" src="assets/bbbs-logo.png" width="1032" height="480" alt="Big Brothers Big Sisters of the Greater Sacramento Area">
      </div>
    </div>

    <div class="hero theme-green" id="hero">
      <div class="wrap">
        <div class="hero-top">
          <a class="back-link" id="back-link" href="./" hidden>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-ui="backLink">All programs</span>
          </a>
          <div class="lang-toggle" role="group" aria-label="Language / Idioma">
            <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
            <button type="button" data-lang="es" lang="es" aria-pressed="false">Español</button>
          </div>
        </div>
        <p class="eyebrow" id="hero-eyebrow">Site-based mentoring</p>
        <h1 class="hero-title" id="hero-title">Become a Big</h1>
        <p class="hero-pill"><span id="hero-pill">Mentor a student at school</span></p>
        <p class="tagline" id="hero-tagline"></p>
        <p class="hero-actions" id="hero-actions"></p>
      </div>
    </div>

    <div class="pattern-band" aria-hidden="true"></div>
  </header>

  <main id="main" tabindex="-1">
    <div id="view">
      <noscript>
        <div class="wrap"><p class="noscript">This site needs JavaScript turned on. / Este sitio necesita que JavaScript esté activado.</p></div>
      </noscript>
    </div>

    <div class="pattern-band contact-band" aria-hidden="true"></div>
    <section class="contact" aria-labelledby="contact-heading">
      <div class="wrap contact-inner">
        <div>
          <h2 id="contact-heading" data-ui="contactHeading">Want more info?</h2>
          <p data-ui="contactIntro"></p>
        </div>
        <div id="contact-details"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p data-ui="footer"></p>
    </div>
  </footer>
</body>
</html>
